---
- name: Firewall default deny with allowed ports
  hosts: all
  tags: [firewall, hardening]
  tasks:
    - name: Ubuntu ufw rules
      when: ansible_os_family == "Debian"
      block:
        - name: Allow ports
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop: "{{ allowed_tcp_ports }}"
        - name: Enable ufw with default deny
          community.general.ufw:
            state: enabled
            policy: deny
            direction: incoming

    - name: Rocky firewalld rules
      when: ansible_os_family == "RedHat"
      block:
        - name: firewalld running
          ansible.builtin.service:
            name: firewalld
            state: started
            enabled: true
        - name: Allow ports
          ansible.posix.firewalld:
            port: "{{ item }}/tcp"
            permanent: true
            immediate: true
            state: enabled
          loop: "{{ allowed_tcp_ports }}"
