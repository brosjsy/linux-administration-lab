---
- name: Baseline for every server
  hosts: all
  tags: [baseline]
  tasks:
    - name: Install base packages (Ubuntu)
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install base packages (Rocky)
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Time sync enabled
      ansible.builtin.service:
        name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
        state: started
        enabled: true

    - name: Login banner
      ansible.builtin.copy:
        src: ../files/issue.net
        dest: /etc/issue.net
        mode: "0644"
