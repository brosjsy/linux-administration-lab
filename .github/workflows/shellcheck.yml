name: ShellCheck
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint scripts
        run: shellcheck scripts/*.sh
      - name: Smoke test
        run: |
          bash scripts/health_check.sh > /dev/null
          bash scripts/disk_alert.sh 100
          bash scripts/user_onboard.sh lab/users.csv.example
